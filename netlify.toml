# Netlify configuration for clearhead.in
# Functions live in netlify/functions and are exposed under /api/* via the redirects below.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# www → non-www canonical redirect
[[redirects]]
  from = "https://www.clearhead.in/*"
  to = "https://clearhead.in/:splat"
  status = 301
  force = true

# /index.html -> / canonical consolidation (defense-in-depth alongside the <link rel=canonical> tags)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Clean URL for the local-intent landing page
[[redirects]]
  from = "/coaching-andheri-west"
  to = "/coaching-andheri-west.html"
  status = 200

# Internal working files must never be publicly readable.
# Netlify publishes the repo root, so anything committed here is fetchable by default.
# Netlify only supports a trailing splat, so extension globs like "/*.md" do NOT work —
# these are enumerated deliberately. force = true is required, otherwise the static file wins.
# Defence in depth: the .skill files are also untracked in git, and audits/ is gitignored.
[[redirects]]
  from = "/audits/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/KNOWLEDGE_MAP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AUDIT_CHANGES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/MANUAL_PUSH_INSTRUCTIONS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PAYMENT_FIX_SUMMARY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP-DASHBOARD-STEPS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Friendly /api/* paths -> serverless functions
[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/razorpay-webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200

# Where browsers send Content-Security-Policy violation reports (see the CSP header below)
[[redirects]]
  from = "/api/csp-report"
  to = "/.netlify/functions/csp-report"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content-Security-Policy-Report-Only: the browser reports what it WOULD block but blocks nothing, so it cannot
    # break the site. Reports go to /api/csp-report (netlify/functions/csp-report.js), which writes one line per
    # violation to the function log: Netlify > Functions > csp-report, search for "[csp-report]".
    # TO ENFORCE: read that log for a week or two. When it shows nothing (or only browser-extension noise, which the
    # function already drops), rename this header to Content-Security-Policy. Do not rename it before there are
    # reports to read.
    # Tested 2026-10-25 in a real browser against the live Razorpay checkout, the Google Maps embed, Google Fonts and
    # GA4 (consent granted): zero violations on pricing, home, Andheri, a blog post, a tool, call, quiz, onboard,
    # thank-you and tools pages. The previous policy would have BLOCKED the Razorpay checkout frame, Razorpay's
    # script and logging hosts, and the Google Maps iframe had it ever been enforced.
    # Razorpay: *.razorpay.com (checkout.js; cdn. loads the risk-detection script; api. is the checkout iframe;
    #   lumberjack. is its logging). Google Maps: www.google.com (frame, on the home and Andheri pages only).
    # GA4: gtag.js from googletagmanager.com, beacons to *.google-analytics.com / *.analytics.google.com; neither is
    #   contacted unless the visitor accepts the consent banner. Blog images come from images.unsplash.com.
    # 'unsafe-inline' stays for scripts and styles because every page has inline script and style blocks.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.razorpay.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://*.google-analytics.com https://*.razorpay.com; connect-src 'self' https://*.razorpay.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://*.razorpay.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report"

# Long-lived caching for static assets that don't change on every deploy without a filename change.
# Netlify still checks freshness via ETag on each deploy, so this is safe: it speeds up repeat visits
# without risking stale content between deploys.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
